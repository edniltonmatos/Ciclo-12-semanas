<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0F0C">
<meta name="description" content="Painel do Ciclo 4 — Grana Certa. Metas, usuários ativos e tempo de espera, semana a semana.">
<title>Grana Certa — Ciclo 12 Semanas</title>
<link rel="icon" type="image/svg+xml" href="app-icon-512.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dash.css">
<script>
(function () {
  var saved = localStorage.getItem('gc-theme');
  var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#F4F5EF' : '#0E0F0C');
})();
</script>
<style>
  html, body { margin: 0; background: #0E0F0C; }
  html[data-theme="light"], html[data-theme="light"] body { background: #F4F5EF; }
  .boot { margin: 0; padding: 48px 20px; text-align: center; font-family: Barlow, system-ui, sans-serif; color: #A6A89C; }
  html[data-theme="light"] .boot { color: #55574E; }
</style>
</head>
<body>
<div id="app"><p class="boot">Carregando…</p></div>
<script src="dash.js"></script>
<script>
(function () {
  // OKR — "1 ano em 12 semanas". As linhas atuais são do ciclo anterior e não há coluna `ciclo`,
  // então este painel não lê nem grava essa tabela. Receita fica no navegador.
  const OKR_SUPABASE_URL = 'https://sbywtjxgkhqdeplymhdz.supabase.co';
  const OKR_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNieXd0anhna2hxZGVwbHltaGR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2ODc3NzUsImV4cCI6MjA5MzI2Mzc3NX0.9lGvokR-HdSdZAh-G0_70_0gwA6SKEtPwrvINmQmTnU';
  void OKR_SUPABASE_URL;
  void OKR_SUPABASE_KEY;

  const TESP_SUPABASE_URL = 'https://qrlsyhffqrprbljhirkk.supabase.co';
  const TESP_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFybHN5aGZmcXJwcmJsamhpcmtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5ODA3OTgsImV4cCI6MjA5MjU1Njc5OH0.kRbbuci-fnHKp6YOX0yUNvuiQ_yKKpdjU5PdBjX1OOo';
  const LIVE_METRICS_RPC = 'get_okr_live_metrics';

  const CYCLE_N = 4;
  const CYCLE_DAYS = 84;
  const CICLO_START = new Date('2026-10-04T00:00:00-03:00');
  const WEEK0_START = new Date('2026-09-27T00:00:00-03:00');
  const USERS = [438, 530, 650, 790, 960, 1160, 1410, 1710, 2080, 2520, 3060, 3710, 4500];
  const REV = [0, 0, 0, 0, 0, 100, 250, 450, 750, 1150, 1650, 2250, 3000];
  const WAIT = [5.6, 5.3, 5.0, 4.7, 4.4, 4.1, 3.8, 3.5, 3.2, 2.9, 2.6, 2.3, 2.0];
  const REVENUE_KEY = 'gc-revenue-entries-c4';
  const CACHE_KEY = 'gc-metric-windows-c4';
  const TZ = 'America/Sao_Paulo';

  const tespHeaders = {
    apikey: TESP_SUPABASE_KEY,
    Authorization: 'Bearer ' + TESP_SUPABASE_KEY,
    'Content-Type': 'application/json',
  };

  let cache = {};
  try { cache = JSON.parse(sessionStorage.getItem(CACHE_KEY) || '{}'); } catch (_) { cache = {}; }
  const inflight = new Map();
  const WEEK = {};
  const DAY = {};
  let LIVE = null;
  let CAL = null;
  let CAL_PREV = null;
  let LIVE15 = null;
  let LIVE15Y = null;
  let receivedAt = null;
  let CUSTOM = null;
  let revenueEntries = loadRevenue();

  function loadRevenue() {
    try {
      const rows = JSON.parse(localStorage.getItem(REVENUE_KEY) || '[]');
      if (!Array.isArray(rows)) return [];
      return rows
        .filter(e => e && !isNaN(Number(e.value)) && !isNaN(Number(e.day)))
        .map(e => ({ day: Number(e.day), iso: e.iso || '', value: Number(e.value), origin: e.origin || '' }));
    } catch (_) { return []; }
  }

  function dateForDay(d) {
    return new Date(CICLO_START.getTime() + (d - 1) * 86400000);
  }
  function isoStamp(dt) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(dt);
  }
  function fmtShort(dt) {
    return new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, day: '2-digit', month: '2-digit' }).format(dt);
  }
  function weekday(dt, style) {
    return new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, weekday: style }).format(dt).replace('.', '');
  }
  function clock(dt) {
    return new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }).format(dt);
  }
  function todayDay() {
    const iso = isoStamp(new Date());
    const noon = new Date(iso + 'T12:00:00-03:00');
    const start = new Date('2026-10-04T12:00:00-03:00');
    return Math.round((noon - start) / 86400000) + 1;
  }
  function dayFromIso(iso) {
    const dt = new Date(iso + 'T00:00:00-03:00');
    return Math.round((dt - CICLO_START) / 86400000) + 1;
  }
  function currentWeek(day) {
    if (day < 1) return 0;
    return Math.min(12, Math.ceil(day / 7));
  }
  function weekOfDay(d) {
    if (d <= 0) return 0;
    return Math.min(12, Math.ceil(d / 7));
  }
  function metaOnDay(arr, d) {
    const w = weekOfDay(d);
    if (w <= 0) return arr[0];
    const capped = Math.min(Math.max(d, 1), 84);
    const dow = ((capped - 1) % 7) + 1;
    return arr[w - 1] + (arr[w] - arr[w - 1]) * (dow / 7);
  }
  function revenueUpTo(day) {
    return revenueEntries.filter(e => e.day <= day).reduce((sum, e) => sum + e.value, 0);
  }

  const TODAY = todayDay();
  const WEEK_NOW = currentWeek(TODAY);
  const WEEK_END = WEEK_NOW <= 0 ? 0 : WEEK_NOW * 7;

  function weekBounds(w, freshEnd) {
    if (w <= 0) return { inicio: WEEK0_START, fim: freshEnd ? new Date() : CICLO_START };
    const inicio = dateForDay((w - 1) * 7 + 1);
    const fim = freshEnd ? new Date() : dateForDay(w * 7 + 1);
    return { inicio, fim };
  }
  function dayBounds(d) {
    const fim = new Date(dateForDay(d).getTime() + 86400000);
    return { inicio: new Date(fim.getTime() - 7 * 86400000), fim };
  }
  function liveBounds() {
    const fim = new Date();
    return { inicio: new Date(fim.getTime() - 7 * 86400000), fim };
  }

  function saveCache() {
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (_) {}
  }

  async function metrics(bounds, fresh) {
    const inicio = bounds.inicio.toISOString();
    const fim = bounds.fim.toISOString();
    const key = inicio + '|' + fim;
    if (!fresh && cache[key]) return cache[key];
    if (inflight.has(key)) return inflight.get(key);
    const run = (async () => {
      try {
        const r = await fetch(TESP_SUPABASE_URL + '/rest/v1/rpc/' + LIVE_METRICS_RPC, {
          method: 'POST',
          headers: tespHeaders,
          body: JSON.stringify({ p_inicio: inicio, p_fim: fim }),
        });
        if (!r.ok) return null;
        const data = await r.json();
        if (!data || (data.wau == null && data.tempo_medio == null)) return null;
        const out = {
          m1: data.wau == null ? null : Number(data.wau),
          m3: data.tempo_medio == null ? null : Number(data.tempo_medio),
          updatedAt: data.updated_at || null,
        };
        if (!fresh) { cache[key] = out; saveCache(); }
        return out;
      } catch (_) {
        return null;
      }
    })();
    const tracked = run.finally(() => inflight.delete(key));
    inflight.set(key, tracked);
    return tracked;
  }

  function keep(prev, next) {
    return next || prev || null;
  }

  async function pool(jobs, size) {
    if (!jobs.length) return;
    let cursor = 0;
    const n = Math.min(size || 6, jobs.length);
    await Promise.all(Array.from({ length: n }, async () => {
      while (cursor < jobs.length) {
        const job = jobs[cursor++];
        try { await job(); } catch (_) {}
      }
    }));
  }

  async function refresh() {
    const jobs = [];
    jobs.push(async () => {
      const next = await metrics(liveBounds(), true);
      LIVE = keep(LIVE, next);
      if (next) receivedAt = Date.now();
    });
    for (let d = TODAY - 13; d < TODAY; d++) {
      jobs.push(async () => {
        const day = d;
        DAY[day] = keep(DAY[day], await metrics(dayBounds(day), false));
      });
    }
    for (let w = 0; w < WEEK_NOW; w++) {
      jobs.push(async () => {
        const week = w;
        WEEK[week] = keep(WEEK[week], await metrics(weekBounds(week, false), false));
      });
    }
    jobs.push(async () => {
      const bounds = weekBounds(WEEK_NOW, true);
      CAL = keep(CAL, await metrics(bounds, true));
      const prev = {
        inicio: new Date(bounds.inicio.getTime() - 7 * 86400000),
        fim: new Date(bounds.fim.getTime() - 7 * 86400000),
      };
      CAL_PREV = keep(CAL_PREV, await metrics(prev, true));
    });
    const now = new Date();
    const yesterday = new Date(now.getTime() - 86400000);
    jobs.push(async () => {
      LIVE15 = keep(LIVE15, await metrics({ inicio: new Date(now.getTime() - 15 * 60 * 1000), fim: now }, true));
    });
    jobs.push(async () => {
      LIVE15Y = keep(LIVE15Y, await metrics({ inicio: new Date(yesterday.getTime() - 15 * 60 * 1000), fim: yesterday }, true));
    });
    await pool(jobs, 6);
    if (CUSTOM && CUSTOM.start && CUSTOM.end) await loadPeriod(CUSTOM.start, CUSTOM.end);
  }

  function m1(slot) {
    return slot && slot.m1 != null ? slot.m1 : null;
  }
  function m3(slot) {
    return slot && slot.m3 != null ? slot.m3 : null;
  }

  function dayPoint(d) {
    const future = d > TODAY;
    const slot = d === TODAY ? LIVE : DAY[d];
    const hasRev = revenueEntries.length > 0;
    return {
      day: d,
      label: fmtShort(dateForDay(d)),
      future,
      users: future ? null : m1(slot),
      usersMeta: metaOnDay(USERS, d),
      wait: future ? null : m3(slot),
      waitMeta: metaOnDay(WAIT, d),
      rev: future || !hasRev ? null : revenueUpTo(d),
      revMeta: metaOnDay(REV, d),
    };
  }

  function weekRange(w) {
    if (w === 0) {
      const end = new Date(CICLO_START.getTime() - 86400000);
      return fmtShort(WEEK0_START) + '–' + fmtShort(end);
    }
    return fmtShort(dateForDay((w - 1) * 7 + 1)) + '–' + fmtShort(dateForDay(w * 7));
  }

  function buildModel() {
    const theme = document.documentElement.getAttribute('data-theme') || 'dark';
    const dow = TODAY >= 1 ? ((Math.min(TODAY, 84) - 1) % 7) + 1 : 7;
    const remain = Math.max(1, 7 - dow + 1);
    const usersReal = m1(LIVE);
    const waitReal = m3(LIVE);
    const yday = DAY[TODAY - 1];
    const daysLeft = Math.max(0, CYCLE_DAYS - Math.max(TODAY, 0));
    const endDate = dateForDay(WEEK_END);
    const todayDate = dateForDay(Math.max(TODAY, 1));
    const hasRev = revenueEntries.length > 0;
    const weeks = [];
    for (let i = 0; i <= 12; i++) {
      const endDay = i === 0 ? 0 : Math.min(i * 7, Math.max(TODAY, 0));
      const slot = i < WEEK_NOW ? WEEK[i] : null;
      weeks.push({
        i,
        range: weekRange(i),
        users: i < WEEK_NOW ? m1(slot) : null,
        wait: i < WEEK_NOW ? m3(slot) : null,
        rev: hasRev && i <= WEEK_NOW ? revenueUpTo(endDay) : null,
        usersTarget: USERS[i],
        waitTarget: WAIT[i],
        revTarget: REV[i],
      });
    }
    const base = (active, prev, copy) => Object.assign({ active, prev }, copy);
    const periods = {
      hoje: base(usersReal, m1(yday), { cmp: 'comparado com ontem', lbl: 'hoje', vs: 'ontem' }),
      ontem: base(m1(yday), m1(DAY[TODAY - 8]), { cmp: 'comparado com os 7 dias anteriores', lbl: 'ontem', vs: 'os 7 dias anteriores' }),
      semana: base(m1(CAL), m1(CAL_PREV), { cmp: 'comparado com os mesmos dias da semana passada', lbl: 'esta semana', vs: 'os mesmos dias da semana passada' }),
      passada: base(m1(WEEK[WEEK_NOW - 1]), m1(WEEK[WEEK_NOW - 2]), { cmp: 'comparado com a semana anterior', lbl: 'semana passada', vs: 'a semana anterior' }),
      custom: CUSTOM || { cmp: 'comparado com o período anterior', lbl: 'o período escolhido', vs: 'o período anterior', active: null, prev: null },
    };
    const days = [];
    const lastDay = Math.max(WEEK_END, TODAY) + 3;
    for (let d = TODAY - 13; d <= lastDay; d++) days.push(dayPoint(d));

    return {
      theme,
      receivedAt,
      updatedLabel: LIVE && LIVE.updatedAt ? clock(new Date(LIVE.updatedAt)) : null,
      cycle: {
        n: CYCLE_N,
        week: WEEK_NOW,
        weeks: 12,
        daysLeft,
        leftLabel: daysLeft === 1 ? 'falta 1 dia' : 'faltam ' + daysLeft + ' dias',
        objective: 'Conseguir monetizar o app',
      },
      today: {
        day: TODAY,
        label: weekday(todayDate, 'short').toLowerCase() + ', ' + fmtShort(todayDate),
        short: fmtShort(todayDate),
        iso: isoStamp(todayDate),
        weekAgoIso: isoStamp(dateForDay(TODAY - 6)),
        weekEndLabel: weekday(endDate, 'long').toLowerCase() + ', ' + fmtShort(endDate),
        weekEndDay: WEEK_END,
      },
      pace: { users: metaOnDay(USERS, TODAY), wait: metaOnDay(WAIT, TODAY), rev: metaOnDay(REV, TODAY) },
      users: usersReal == null ? null : {
        real: usersReal,
        metaToday: metaOnDay(USERS, TODAY),
        delta: yday && yday.m1 != null ? usersReal - yday.m1 : null,
        neededToday: (USERS[WEEK_NOW] - usersReal) / remain,
      },
      wait: waitReal == null ? null : { real: waitReal, metaToday: metaOnDay(WAIT, TODAY) },
      revenue: { hasEntries: hasRev, real: revenueUpTo(TODAY), metaToday: metaOnDay(REV, TODAY) },
      running: LIVE15 && LIVE15.m1 != null ? {
        now: LIVE15.m1,
        delta: LIVE15Y && LIVE15Y.m1 != null ? LIVE15.m1 - LIVE15Y.m1 : null,
      } : null,
      periods,
      weeks,
      days,
      loadPeriod,
      loadDays,
      saveRevenue,
    };
  }

  async function loadPeriod(startIso, endIso) {
    if (!startIso || !endIso) return CUSTOM;
    let start = new Date(startIso + 'T00:00:00-03:00');
    let end = new Date(endIso + 'T00:00:00-03:00');
    if (isNaN(start.getTime()) || isNaN(end.getTime())) return CUSTOM;
    if (start > end) { const swap = start; start = end; end = swap; }
    const fim = new Date(end.getTime() + 86400000);
    const prevFim = start;
    const prevInicio = new Date(start.getTime() - (fim - start));
    const [cur, prev] = await Promise.all([
      metrics({ inicio: start, fim }, true),
      metrics({ inicio: prevInicio, fim: prevFim }, true),
    ]);
    CUSTOM = {
      cmp: 'comparado com o período anterior',
      lbl: fmtShort(start) + '–' + fmtShort(end),
      vs: 'o período anterior',
      active: m1(cur),
      prev: m1(prev),
      start: isoStamp(start),
      end: isoStamp(end),
    };
    return CUSTOM;
  }

  async function loadDays(startIso, endIso) {
    let a = dayFromIso(startIso);
    let b = dayFromIso(endIso);
    if (isNaN(a) || isNaN(b)) return [];
    if (a > b) { const swap = a; a = b; b = swap; }
    b = Math.min(b, a + 90);
    const jobs = [];
    for (let d = a; d <= b && d < TODAY; d++) {
      const day = d;
      jobs.push(async () => { DAY[day] = keep(DAY[day], await metrics(dayBounds(day), false)); });
    }
    if (b >= TODAY && a <= TODAY) jobs.push(async () => { LIVE = keep(LIVE, await metrics(liveBounds(), true)); });
    await pool(jobs, 6);
    const out = [];
    for (let d = a; d <= b; d++) out.push(dayPoint(d));
    return out;
  }

  function saveRevenue(entry) {
    const day = dayFromIso(entry.iso);
    if (!entry.iso || isNaN(day) || day < -6 || day > CYCLE_DAYS) {
      return { ok: false, error: 'Escolha uma data dentro do ciclo.' };
    }
    revenueEntries = revenueEntries
      .filter(e => e.day !== day)
      .concat([{ day, iso: entry.iso, value: entry.value, origin: entry.origin || '' }])
      .sort((a, b) => a.day - b.day);
    try { localStorage.setItem(REVENUE_KEY, JSON.stringify(revenueEntries)); } catch (_) {}
    return { ok: true, model: buildModel() };
  }

  async function boot() {
    try { await refresh(); } catch (_) {}
    GCM.render(document.getElementById('app'), buildModel());
    setInterval(async () => {
      try { await refresh(); } catch (_) {}
      GCM.setModel(buildModel());
    }, 5 * 60 * 1000);
  }
  boot();
})();
</script>
</body>
</html>
